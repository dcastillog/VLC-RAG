# Experiment / tunable configuration.
#
# Infrastructure values (URLs, contact emails) do NOT belong here -- those come
# from the environment / .env via ragvlc.config.Settings. This file holds only
# knobs that change how a run behaves and that we may want to sweep later.
#
# At this stage only parsing-related keys exist. Retrieval / chunking / eval keys
# will be added in a later prompt.

parsing:
  grobid:
    timeout_seconds: 120        # GROBID can take 30+ s on a long paper
    max_retries: 2              # retries on connection error / 5xx / timeout before failing loudly
    retry_backoff_seconds: 2    # linear backoff: sleep attempt_number * this, between retries
    consolidate_header: 1       # form fields passed to /api/processFulltextDocument
    consolidate_citations: 0
    include_raw_affiliations: 0
    segment_sentences: 0

  min_unit_chars: 30            # drop units whose normalized text is shorter (parsing debris)
  unit_separator: "\n\n"        # canonical join separator; the only non-single-space
                                # whitespace in the canonical text. Changing this
                                # invalidates every annotated offset.

  crossref:
    sleep_seconds: 0.2          # polite pause between Crossref / Unpaywall calls
    timeout_seconds: 15         # both APIs are small JSON REST calls, unlike GROBID

  quality_gates:                # scripts/parse_corpus.py flags papers that fail these
    min_sections: 4             # fewer -> likely a structural parse failure
    min_chars: 5000             # fewer -> likely a truncated parse
    min_mean_unit_chars: 100    # lower -> likely fragmented
    min_alpha_ratio: 0.7        # lower -> likely garbled
    max_non_ascii_ratio: 0.02   # higher -> likely broken math-font encoding

chunking:
  tokenizer_model: "BAAI/bge-small-en-v1.5"  # token counts come from THIS model's
                                             # tokenizer, not whitespace: the embedder
                                             # truncates silently at 512 tokens and an
                                             # approximate count would hide lost tails.
  max_tokens: 400              # single per-chunk budget both chunkers obey; 400 < 512
                               # leaves headroom for [CLS]/[SEP] and the query prefix.
  fixed:
    overlap_tokens: 60         # tokens shared between consecutive fixed-size chunks
  section_aware:
    min_chunk_tokens: 50       # a unit smaller than this merges into an adjacent unit,
                               # but only when both share the same section_heading
    min_indexed_tokens: 15     # section_aware only: chunks below this are dropped, not
                               # indexed (near-zero signal, still cost a top-k slot).
                               # fixed is exempt -- its short chunks are real paper tails.

retrieval:
  dense_model: "BAAI/bge-small-en-v1.5"   # must equal chunking.tokenizer_model
  sparse_model: "Qdrant/bm25"             # FastEmbed BM25; IDF is computed by Qdrant
  # Prepended to queries only (never to documents). BGE is trained with this
  # asymmetry; kept in exactly one place so the two sides cannot drift.
  query_prefix: "Represent this sentence for searching relevant passages: "
  prefetch_limit: 100          # candidates per hybrid branch before fusion; recall ceiling.
                               # 100 not 50: the Phase E pool is built once from these hits,
                               # so this also permanently bounds the judged ground truth. At
                               # ~3.3k vectors with exact search the extra cost is negligible.
  rrf_k: 2                      # Qdrant default; original RRF paper uses 60. Phase G sweeps it.
  qdrant:
    collections:
      fixed: "vlc_fixed"
      section_aware: "vlc_section"
    upsert_batch_size: 128
    indexing_threshold_kb: null   # null -> Qdrant default (~20 MB); Phase G lowers it

generation:
  top_k: 5                     # chunks retrieved and numbered [1]..[k] in the context block
  temperature: 0.0             # deterministic by default -- a measurement project should not
                               # ship a nondeterministic answer layer without saying so
  max_tokens: 4096             # ceiling on generated tokens -- generous: a reasoning model
                               # (qwen3) spends completion tokens thinking before it answers,
                               # and too small a budget gets eaten before any answer text
  timeout_seconds: 120         # a small local model can take tens of seconds on a long context

eval:
  relevance_threshold: 0.5     # chunk is relevant when overlap >= this fraction of
                               # min(len(chunk), len(gold_span)) -- symmetric, so it
                               # does not matter which chunker produced the judged span
  success_at_k: [1, 3, 5, 10]
  mrr_k: 10                    # primary metric: MRR@10
  random_seed: 42
  bootstrap_resamples: 10000
  idf_corpus_chunker: "fixed"  # arbitrary but fixed -- see EvalConfig docstring

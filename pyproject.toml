[project]
name = "rag-vlc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.19.0",
]

[project.scripts]
rag-vlc = "ragvlc:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Project is named `rag-vlc` but the import package is `ragvlc` (matches the
# parsing-pipeline spec). Tell uv_build where the module actually lives.
module-name = "ragvlc"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
